        promo:
          $ref: "#/components/schemas/PromoBalance"
        wallet:
          $ref: "#/components/schemas/Wallet"
        spent_today_usd:
          description: "USD spent in the current calendar day (UTC). Exact to the\
            \ micro-dollar so sub-cent micro-payments survive (\"0.0005\", \"0.42\"\
            ), never narrower than two decimals; a zero total renders as \"0.00\"."
          example: "0.0005"
          type: string
        spent_week_usd:
          description: "USD spent in the current calendar week (UTC, Monday start).\
            \ Exact to the micro-dollar (\"0.0005\", \"3.10\"), never narrower than\
            \ two decimals; a zero total renders as \"0.00\"."
          example: "3.10"
          type: string
        policy_used_today_usd:
          description: "USD currently counted against the daily spending limit: pending\
            \ authorizations at their maximum plus settled payments at the amount\
            \ that moved. Exact to the micro-dollar; zero renders as \"0.00\"."
          example: "0.30"
          type: string
        policy_used_week_usd:
          description: "USD currently counted against the weekly spending limit: pending\
            \ authorizations at their maximum plus settled payments at the amount\
            \ that moved. Exact to the micro-dollar; zero renders as \"0.00\"."
          example: "3.30"
          type: string
        policy:
          $ref: "#/components/schemas/SpendingPolicy"
      required:
      - policy
      - policy_used_today_usd
      - policy_used_week_usd
      - promo
      - spent_today_usd
      - spent_week_usd
      - wallet
