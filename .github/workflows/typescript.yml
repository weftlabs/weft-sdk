name: TypeScript SDK

on:
  pull_request:
    paths:
      - "typescript/**"
      - "conformance/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "spec/**"
      - "scripts/**"
      # Self-test: a change to this workflow must run this workflow, otherwise
      # CI-config regressions land unexercised.
      - ".github/workflows/typescript.yml"
  push:
    branches: ["main"]
    tags: ["v*"]
    # release tags (v* / go/v*) are pushed by bump-version.sh which touches
    # all four language dirs + spec — if that ever changes, revisit these push
    # paths so publishing can't silently die. (Path filters are not evaluated
    # for tag pushes, so the tags above always run; this only trims main
    # pushes that don't touch the SDK.)
    paths:
      - "typescript/**"
      - "conformance/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "spec/**"
      - "scripts/**"

# Default GITHUB_TOKEN is read-only for the whole workflow. The publish job
# overrides this with its own job-level `permissions:` (id-token: write for
# npm Trusted Publishing OIDC, attestations: write for Sigstore provenance).
# Keeping the workflow default minimal closes the default-scope exfiltration
# window on PR-triggered build jobs that run `pnpm install` against untrusted
# spec/** or scripts/** changes.
permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

# github.workflow MUST stay in the group key. Every language workflow and the
# e2e/sync workflows fire on the same ref; a group keyed on the ref alone puts
# them all in one slot, so with cancel-in-progress the last run created cancels
# the others before a single step executes. That shows up on the PR as a red
# "build"/"publish" check that failed in 0s with no logs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Tag runs publish shared registry state and must finish once started.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify committed generated SDK
        run: ./scripts/check-generated.sh typescript
      - name: Lint
        run: pnpm run lint:check
      - name: Test
        env:
          WEFT_PACKAGE_ARCHIVES: ${{ runner.temp }}/npm-archives
        run: pnpm run test
      - name: Retain tested npm archives
        uses: actions/upload-artifact@v7
        with:
          name: npm-archives-${{ github.sha }}
          path: ${{ runner.temp }}/npm-archives/*.tgz
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # id-token: write is required for npm provenance (Sigstore via GitHub
    # OIDC). attestations: write lets the npm CLI record the provenance on
    # the repository's attestations page in addition to the registry.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Download tested npm archives
        uses: actions/download-artifact@v8
        with:
          name: npm-archives-${{ github.sha }}
          path: ${{ runner.temp }}/npm-archives
      # No dependency installation or build occurs in the OIDC-enabled job.
      - name: Publish the tested SDK archive with provenance
        env:
          ARCHIVE_DIRECTORY: ${{ runner.temp }}/npm-archives
        run: node scripts/publish-npm-archives.mjs "$ARCHIVE_DIRECTORY"
