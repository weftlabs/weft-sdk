name: Ruby SDK

on:
  pull_request:
    paths:
      - "ruby/**"
      - "conformance/**"
      - "spec/**"
      - "scripts/**"
      # Self-test: a change to this workflow must run this workflow, otherwise
      # CI-config regressions land unexercised.
      - ".github/workflows/ruby.yml"
  push:
    branches: ["main"]
    tags: ["v*"]
    # release tags (v* / go/v*) are pushed by bump-version.sh which touches
    # all four language dirs + spec — if that ever changes, revisit these push
    # paths so publishing can't silently die. (Path filters are not evaluated
    # for tag pushes, so the tags above always run; this only trims main
    # pushes that don't touch the SDK.)
    paths:
      - "ruby/**"
      - "conformance/**"
      - "spec/**"
      - "scripts/**"

# Default GITHUB_TOKEN is read-only for the whole workflow. The publish job
# overrides this with its own job-level `permissions:` (id-token: write for
# RubyGems Trusted Publishing OIDC, attestations: write for the
# actions/attest-build-provenance attestation on the built .gem). Keeping the
# workflow default minimal closes the default-scope exfiltration window on
# PR-triggered build jobs that run `bundle install` against untrusted spec/**
# or scripts/** changes.
permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

# github.workflow MUST stay in the group key. Every language workflow and the
# e2e/sync workflows fire on the same ref; a group keyed on the ref alone puts
# them all in one slot, so with cancel-in-progress the last run created cancels
# the others before a single step executes. That shows up on the PR as a red
# "build"/"publish" check that failed in 0s with no logs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ruby
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ruby
      - name: Verify committed generated SDK
        run: ../scripts/check-generated.sh ruby
      - name: Test
        run: bundle exec rake test

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # id-token: write is required for both RubyGems Trusted Publishing
    # (OIDC) and for actions/attest-build-provenance below.
    # attestations: write lets the attestation land on the repo's
    # attestations page (gh attestation verify <gem-file>).
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: ruby
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ruby
      - name: Verify committed generated SDK
        run: ../scripts/check-generated.sh ruby
      - name: Build gem
        run: gem build weft-sdk.gemspec
      # RubyGems has no first-party Sigstore attestation pipeline on
      # `gem push` (rubygems/configure-rubygems-credentials@v2 covers OIDC
      # credentials only). We attach a GitHub-native build-provenance
      # attestation to the built .gem before publishing; consumers can
      # verify with `gh attestation verify weft-sdk-<version>.gem
      # --repo weftlabs/weft-sdk`.
      - name: Attest gem provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "ruby/weft-sdk-*.gem"
      - name: Configure RubyGems trusted publishing
        uses: rubygems/configure-rubygems-credentials@v2.1.0
      - name: Publish to RubyGems
        run: gem push weft-sdk-*.gem
