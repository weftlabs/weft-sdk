name: Curation

# No path filter. This check is cheap, and branch protection will require the
# `curation` job. A paths filter would leave that required check pending on
# PRs that do not touch the listed paths.
on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

# Include the workflow name so this run does not cancel another workflow on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  curation:
    name: curation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check operation inventory
        run: node scripts/check-operation-inventory.mjs
      - name: Test operation inventory checker
        run: node --test scripts/check-operation-inventory.test.mjs
