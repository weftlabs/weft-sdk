name: Public artifact acceptance

on:
  pull_request:
    paths:
      - "typescript/**"
      - "cli/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "python/**"
      - "ruby/**"
      - "go/**"
      - "scripts/test-public-quickstarts.sh"
      - "scripts/test-python-quickstart.py"
      - "scripts/test-typescript-quickstarts.mjs"
      - "scripts/test-seller-quickstarts.mjs"
      - ".github/workflows/artifact-acceptance.yml"
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ruby
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache-dependency-path: go/go.sum
      - name: Install build dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install build
      - name: Build and clean-install public artifacts
        run: ./scripts/test-public-quickstarts.sh
