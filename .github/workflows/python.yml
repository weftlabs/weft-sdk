name: Python SDK

on:
  pull_request:
    paths:
      - "python/**"
      - "conformance/**"
      - "spec/**"
      - "scripts/**"
      # Self-test: a change to this workflow must run this workflow, otherwise
      # CI-config regressions land unexercised.
      - ".github/workflows/python.yml"
  push:
    branches: ["main"]
    tags: ["v*"]
    # release tags (v* / go/v*) are pushed by bump-version.sh which touches
    # all four language dirs + spec — if that ever changes, revisit these push
    # paths so publishing can't silently die. (Path filters are not evaluated
    # for tag pushes, so the tags above always run; this only trims main
    # pushes that don't touch the SDK.)
    paths:
      - "python/**"
      - "conformance/**"
      - "spec/**"
      - "scripts/**"

# Default GITHUB_TOKEN is read-only for the whole workflow. The publish job
# overrides this with its own job-level `permissions:` (id-token: write for
# PyPI Trusted Publishing OIDC, attestations: write for Sigstore provenance).
# Keeping the workflow default minimal closes the default-scope exfiltration
# window on PR-triggered build jobs that run `pip install` against untrusted
# spec/** or scripts/** changes.
permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

# github.workflow MUST stay in the group key. Every language workflow and the
# e2e/sync workflows fire on the same ref; a group keyed on the ref alone puts
# them all in one slot, so with cancel-in-progress the last run created cancels
# the others before a single step executes. That shows up on the PR as a red
# "build"/"publish" check that failed in 0s with no logs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install dependencies
        run: |
          pip install hatchling
          pip install -e .
          pip install pytest pytest-asyncio ruff mypy
      - name: Verify committed generated SDK
        run: ../scripts/check-generated.sh python
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # id-token: write is required for both Trusted Publishing AND for the
    # Sigstore attestations the action emits (default-on under release/v1).
    # attestations: write makes the attestation visible on the repo's
    # attestations page in addition to the PyPI release.
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install build tools
        run: pip install hatchling build
      - name: Verify committed generated SDK
        run: ../scripts/check-generated.sh python
      - name: Build package
        run: python -m build
      # pypa/gh-action-pypi-publish@release/v1 emits Sigstore attestations
      # by default when used with Trusted Publishing (see action README).
      # Setting attestations: true makes the contract explicit so a future
      # default flip cannot silently drop provenance.
      - name: Publish to PyPI with Sigstore attestations
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          attestations: true
